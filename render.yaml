# Render Blueprint: the full playbook stack on managed services (New > Blueprint > this repo).
# Web API (Docker image with Tesseract) with the RQ OCR worker running in the same container
# (RUN_WORKER=1, so no paid worker service is needed), Redis (Key Value), PostgreSQL.
# After the first deploy: open the database's shell and run `CREATE EXTENSION postgis;`
# (the app also tries this on start), then set ADMIN_TOKEN and ANTHROPIC_API_KEY.
services:
  - type: web
    name: dawacheck-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: dawacheck-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: dawacheck-redis, property: connectionString}
      - key: RUN_WORKER
        value: "1"
      - key: USER_HASH_SALT
        generateValue: true
      - key: ADMIN_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
  - type: keyvalue
    name: dawacheck-redis
    plan: free
    ipAllowList: []

databases:
  - name: dawacheck-db
    databaseName: dawacheck
    plan: free
